<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ニュースリリース監視ダッシュボード</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #4f8ef7;
      --accent2: #7c6af7;
      --new: #22c55e;
      --new-bg: rgba(34,197,94,0.10);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    /* ---- Header ---- */
    header {
      background: linear-gradient(135deg, #1e2340 0%, #12162b 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(8px);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.3px; }
    h1 span { color: var(--accent); }

    #updated {
      font-size: .78rem; color: var(--muted);
    }

    /* ---- Toolbar ---- */
    .toolbar {
      max-width: 1100px; margin: 20px auto 0; padding: 0 20px;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .toolbar input {
      flex: 1; min-width: 180px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px;
      padding: 8px 14px; font-size: .88rem;
      outline: none; transition: border .2s;
    }
    .toolbar input:focus { border-color: var(--accent); }

    .filter-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); border-radius: 8px;
      padding: 7px 14px; font-size: .82rem; cursor: pointer;
      transition: all .15s;
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent); border-color: var(--accent);
      color: #fff;
    }

    /* ---- Stats ---- */
    .stats {
      max-width: 1100px; margin: 16px auto 0; padding: 0 20px;
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 20px;
      flex: 1; min-width: 120px;
    }
    .stat-card .val { font-size: 1.6rem; font-weight: 700; }
    .stat-card .val.green { color: var(--new); }
    .stat-card .label { font-size: .75rem; color: var(--muted); margin-top: 2px; }

    /* ---- Company filter chips ---- */
    #company-chips {
      max-width: 1100px; margin: 14px auto 0; padding: 0 20px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px;
      font-size: .78rem; cursor: pointer; transition: all .15s;
      color: var(--muted);
    }
    .chip:hover, .chip.active {
      background: var(--accent2); border-color: var(--accent2); color: #fff;
    }

    /* ---- News list ---- */
    #news-list {
      max-width: 1100px; margin: 20px auto 40px;
      padding: 0 20px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .news-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 18px;
      display: flex; align-items: flex-start; gap: 14px;
      transition: border-color .15s, transform .1s;
    }
    .news-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .news-card.is-new {
      border-color: var(--new);
      background: linear-gradient(135deg, var(--new-bg) 0%, var(--surface) 60%);
    }

    .news-card .badge-new {
      background: var(--new); color: #000;
      font-size: .65rem; font-weight: 700;
      border-radius: 4px; padding: 2px 6px;
      white-space: nowrap; flex-shrink: 0; align-self: center;
    }

    .news-card .body { flex: 1; min-width: 0; }
    .news-card .company-tag {
      font-size: .72rem; color: var(--accent2); font-weight: 600;
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 4px;
    }
    .news-card .title {
      font-size: .92rem; line-height: 1.5; color: var(--text);
      word-break: break-word;
    }
    .news-card a.title:hover { color: var(--accent); text-decoration: underline; }
    .news-card a { text-decoration: none; }

    /* ---- Empty state ---- */
    #empty {
      display: none; text-align: center;
      padding: 60px 20px; color: var(--muted);
    }
    #empty p { font-size: 1rem; }

    /* ---- Loading ---- */
    #loading {
      text-align: center; padding: 60px;
      color: var(--muted); font-size: .95rem;
    }

    /* ---- Responsive ---- */
    @media (max-width: 600px) {
      h1 { font-size: 1rem; }
      .stat-card .val { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>📡 ニュース<span>リリース</span>モニター</h1>
    <div id="updated">読み込み中...</div>
  </div>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="キーワードで絞り込み..." />
  <button class="filter-btn active" data-filter="all">すべて</button>
  <button class="filter-btn" data-filter="new">🟢 新着のみ</button>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="val" id="stat-total">—</div>
    <div class="label">取得件数</div>
  </div>
  <div class="stat-card">
    <div class="val green" id="stat-new">—</div>
    <div class="label">新着件数</div>
  </div>
  <div class="stat-card">
    <div class="val" id="stat-companies">—</div>
    <div class="label">監視企業数</div>
  </div>
</div>

<div id="company-chips"></div>

<div id="news-list">
  <div id="loading">データを読み込んでいます...</div>
</div>
<div id="empty"><p>該当するニュースが見つかりません。</p></div>

<script>
  const NEWS_JSON = "./news.json";

  let allNews = [];
  let currentFilter = "all";
  let currentCompany = "all";
  let currentSearch = "";

  async function loadData() {
    try {
      const res = await fetch(`${NEWS_JSON}?t=${Date.now()}`);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      return data;
    } catch (e) {
      document.getElementById("loading").textContent =
        "⚠️ news.json の読み込みに失敗しました。GitHub Actions を一度手動実行してください。";
      return null;
    }
  }

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo",
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit" });
  }

  function render() {
    const q = currentSearch.toLowerCase();
    const filtered = allNews.filter(n => {
      if (currentFilter === "new" && !n.is_new) return false;
      if (currentCompany !== "all" && n.company !== currentCompany) return false;
      if (q && !n.text.toLowerCase().includes(q) && !n.company.toLowerCase().includes(q)) return false;
      return true;
    });

    const list = document.getElementById("news-list");
    const empty = document.getElementById("empty");

    // clear
    [...list.children].forEach(c => { if (c.id !== "loading") c.remove(); });
    document.getElementById("loading").style.display = "none";

    if (filtered.length === 0) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    filtered.forEach(n => {
      const card = document.createElement("div");
      card.className = "news-card" + (n.is_new ? " is-new" : "");

      const titleEl = n.url
        ? `<a class="title" href="${n.url}" target="_blank" rel="noopener">${escHtml(n.text)}</a>`
        : `<span class="title">${escHtml(n.text)}</span>`;

      card.innerHTML = `
        ${n.is_new ? '<span class="badge-new">NEW</span>' : ""}
        <div class="body">
          <div class="company-tag">
            <a href="${escHtml(n.company_url)}" target="_blank" rel="noopener"
               style="color:inherit;text-decoration:none;">${escHtml(n.company)}</a>
          </div>
          ${titleEl}
        </div>`;
      list.appendChild(card);
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function buildChips(companies) {
    const wrap = document.getElementById("company-chips");
    wrap.innerHTML = "";

    const allChip = document.createElement("span");
    allChip.className = "chip active";
    allChip.textContent = "すべての企業";
    allChip.dataset.company = "all";
    wrap.appendChild(allChip);

    companies.forEach(c => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = c;
      chip.dataset.company = c;
      wrap.appendChild(chip);
    });

    wrap.addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      [...wrap.querySelectorAll(".chip")].forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentCompany = chip.dataset.company;
      render();
    });
  }

  (async () => {
    const data = await loadData();
    if (!data) return;

    allNews = data.news || [];
    document.getElementById("updated").textContent = `最終更新: ${fmtDate(data.updated_at)}`;

    const companies = [...new Set(allNews.map(n => n.company))];
    const newCount  = allNews.filter(n => n.is_new).length;

    document.getElementById("stat-total").textContent     = allNews.length;
    document.getElementById("stat-new").textContent       = newCount;
    document.getElementById("stat-companies").textContent = companies.length;

    buildChips(companies);

    // filter buttons
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // search
    document.getElementById("search").addEventListener("input", e => {
      currentSearch = e.target.value;
      render();
    });

    render();
  })();
</script>
</body>
</html>
