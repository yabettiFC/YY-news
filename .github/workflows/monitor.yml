name: News Monitor

on:
  schedule:
    - cron: "0 23 * * *"   # 8:00 JST
    - cron: "0 3 * * *"    # 12:00 JST
    - cron: "0 9 * * *"    # 18:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scripts/scrape.py

      - name: Commit & push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json docs/news.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: update news $(date +'%Y-%m-%d %H:%M JST')"
          git push
